name: Publish upstream modernization beta v2026.11.16b1 (one-time)

# Only the deliberate commit below triggers publishing. Ordinary pushes
# and pull requests cannot create a release from this workflow.
on:
  push:
    branches:
      - beta/2026-modernization

permissions:
  contents: write
  checks: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish v2026.11.16b1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact release candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate beta metadata and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path("custom_components/alarmdotcom")
          manifest = json.loads((root / "manifest.json").read_text())
          expected = "2026.11.16b1"
          assert manifest["version"] == expected, manifest["version"]
          nodes = ast.parse((root / "_pyalarmdotcomajax/_version.py").read_text()).body
          version = next(
              ast.literal_eval(node.value)
              for node in nodes
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          assert version == expected, version
          assert Path(f"release-notes/{expected}.md").is_file()
          print(f"Validated integration, library, and release notes for {expected}")
          PY
      - name: Verify all six checks passed on this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            set +e
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              | python -c '
          import json
          import sys

          required = {
              "HACS and Hassfest validation",
              "HA Core 2026.11.1 compatibility",
              "HA Core 2026.11.0 compatibility",
              "Check version, camera card, and ZIP package",
              "Python regression tests",
              "pre-commit",
          }
          runs = {r["name"]: r for r in json.load(sys.stdin)["check_runs"]}
          failures = [n for n in required if n in runs and runs[n]["conclusion"] in
                      ("failure", "cancelled", "timed_out", "action_required")]
          if failures:
              print("Blocking failed checks:", ", ".join(failures))
              sys.exit(1)
          pending = [n for n in required if n not in runs or runs[n]["conclusion"] != "success"]
          if pending:
              print("Waiting for:", ", ".join(pending))
              sys.exit(2)
          print("All six required checks passed on the release SHA.")
          '
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              break
            elif [ "$result" -ne 2 ]; then
              echo "A required check failed."
              exit 1
            elif [ "$attempt" -eq 80 ]; then
              echo "Timed out awaiting required checks."
              exit 1
            fi
            sleep 10
          done
      - name: Confirm the prerelease tag does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2026.11.16b1" >/dev/null 2>&1; then
            echo "Release tag already exists. Refusing to overwrite or republish."
            exit 1
          fi
      - name: Package Home Assistant integration
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components
          zip -rq ../alarmdotcom.zip alarmdotcom -x '*__pycache__*' '*.pyc'
          cd ..
          unzip -tq alarmdotcom.zip
          unzip -Z -1 alarmdotcom.zip | grep -qx 'alarmdotcom/manifest.json'
          unzip -Z -1 alarmdotcom.zip | grep -qx 'alarmdotcom/__init__.py'
          unzip -Z -1 alarmdotcom.zip | grep -qx 'alarmdotcom/_pyalarmdotcomajax/__init__.py'
      - name: Publish once as GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.11.16b1
          target_commitish: ${{ github.sha }}
          name: Alarm.com 2026.11.16b1 Beta
          prerelease: true
          make_latest: false
          body_path: release-notes/2026.11.16b1.md
          files: alarmdotcom.zip
